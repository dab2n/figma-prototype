<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1033"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Sports</title>
<link rel="stylesheet" href="styles/main.css?v=1033">
<link rel="stylesheet" href="styles/onboarding.css?v=1033">
<script defer src="assets/idle.js?v=1033"></script>
<script defer src="assets/flows.js?v=1033"></script>
</head>
<body>
<div class="phone">
  <div class="screen ob-screen" style="display:flex; flex-direction:column;">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="ob-appbar">
      <a class="back" href="index.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
      <a class="skip" href="onboarding-goal.html">Skip</a>
    </div>

    <div class="ob-title">
      <h1>What kinds of<br>sports are you into?</h1>
      <p>You can pick more than one.</p>
    </div>

    <div class="ob-body" data-group>
      <div class="ob-grid">
        <div class="ob-col">
          <div class="ob-card tall"  data-toggle><p class="t">Running</p><div class="img" style="background-image:url('assets/photos/sport-running.png?v=1033')"></div></div>
          <div class="ob-card short" data-toggle><p class="t">Marathon</p><div class="img" style="background-image:url('assets/photos/sport-marathon.png?v=1033'); background-position:right bottom;"></div></div>
          <div class="ob-card tall"  data-toggle><p class="t">Basketball</p><div class="img" style="background-image:url('assets/photos/sport-basketball.png?v=1033')"></div></div>
          <div class="ob-card short" data-toggle><p class="t">Dance</p><div class="img" style="background-image:url('assets/photos/sport-dance.png?v=1033'); background-position:right bottom;"></div></div>
          <div class="ob-card tall"  data-toggle><p class="t">Golf</p><div class="img" style="background-image:url('assets/photos/sport-golf.png?v=1033')"></div></div>
        </div>
        <div class="ob-col">
          <div class="ob-card short" data-toggle><p class="t">Tennis</p><div class="img" style="background-image:url('assets/photos/sport-tennis.png?v=1033'); background-position:right bottom;"></div></div>
          <div class="ob-card tall"  data-toggle><p class="t">Boxing</p><div class="img" style="background-image:url('assets/photos/sport-boxing.png?v=1033')"></div></div>
          <div class="ob-card short" data-toggle><p class="t">Soccer</p><div class="img" style="background-image:url('assets/photos/sport-soccer.png?v=1033'); background-position:right bottom;"></div></div>
          <div class="ob-card tall"  data-toggle><p class="t">Hiking</p><div class="img" style="background-image:url('assets/photos/sport-hiking.png?v=1033')"></div></div>
          <div class="ob-card short" data-toggle><p class="t">Home<br>Workout</p><div class="img" style="background-image:url('assets/photos/sport-hometraining.png?v=1033'); background-position:right bottom;"></div></div>
          <div class="ob-card tall"  data-toggle><p class="t">Badminton</p><div class="img" style="background-image:url('assets/photos/sport-badminton.png?v=1033')"></div></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar ob-bottom">
    <div class="sb-row">
      <a class="ob-next" href="onboarding-goal.html">Next <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script src="assets/onboarding.js?v=1033"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FA3030">
<script defer src="assets/openext.js?v=988"></script>
<script defer src="assets/tour.js?v=988"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Session Recap</title>
<link rel="stylesheet" href="styles/main.css?v=988">
<link rel="stylesheet" href="styles/recap.css?v=988">
</head>
<body>
<div class="phone">
  <div class="screen recap-screen" id="recapScreen">
    <video class="recap-clip" id="clip" src="assets/video/recap-overlay.mp4?v=988"
           muted playsinline webkit-playsinline autoplay loop preload="auto" disablepictureinpicture></video>
    <!-- Three layers, exactly as drawn: the black clip, its own fill whitening the foot,
         and the blur blob over both on lighten. Nothing else — the earlier full-frame
         wash was a fourth layer the design never had, and it is what made the colour
         read wrong. -->
    <div class="recap-fade"></div>
    <img class="recap-glow" src="assets/photos/session-recap-blur.svg" alt="">

    <div class="status-bar on-dark" style="position:absolute; top:0; left:0; z-index:6;"><img class="statusbar-svg" src="assets/icons/statusbar-full-dark.svg" alt="9:41"></div>

    <p class="recap-title">Session Recap</p>

    <div class="recap-match">
      <p class="recap-match-label">Outstanding Match</p>
      <div class="recap-pct"><span class="num">0.0</span><span class="unit">pts</span></div>
    </div>

    <!-- A plain link now: tap it and the report opens. The drag-to-commit gesture and the
         chevron that advertised it are gone. -->
    <a class="recap-full" href="records.html">
      <span>View Full Report</span>
    </a>
  </div>
</div>
<script>
// One runner, looping. The clip used to dissolve the creator's run into the user's and
// the score landed on the overlap; the second figure is cut and what is left is the
// front runner alone, trimmed to his own stride and made to loop on himself. Muted,
// playsinline, no controls, so it just runs on a phone too.
(function () {
  var clip = document.getElementById('clip');
  var num = document.querySelector('.recap-pct .num');
  var scored = false;

  // muted set from script as well as markup: iOS treats the property, not the attribute,
  // as the autoplay permission, and losing it is what puts the start-playback button on
  // the frame. Any first interaction retries, so a refusal is never permanent.
  function play(v) { v.muted = true; var p = v.play(); if (p && p.catch) p.catch(function () {}); }

  // The clip is one 0.83s stride that loops on itself — 20 frames is the runner's own
  // cycle, and the four frames either side of the join are cross-dissolved IN THE FILE,
  // so the native `loop` carries it with no seam and nothing here has to fade anything.
  // (It used to dip to transparent and back around the loop point, which was the only way
  // to hide a hard cut between two different people. There is one person now.)
  (function frame() {
    // Not playing means HIDDEN, not paused-and-showing. iOS draws its own start-playback
    // button over a video it refused to autoplay (Low Power Mode does this every time),
    // and no amount of CSS on the shadow control reliably removes it — so the element
    // itself goes away, leaving the gradient, which is what the frame is anyway. The
    // first tap starts it and it comes back.
    clip.style.visibility = clip.paused ? 'hidden' : 'visible';
    requestAnimationFrame(frame);
  })();

  // How long the count takes. It used to be read off the clip — the two runners overlapped
  // most evenly at 2.25s and the number landed there — but there is only one runner now
  // and the clip is a 0.83s loop, so there is no moment in it to aim at. The duration the
  // score was approved at is kept as a plain number.
  var COUNT = 2250;
  function revealScore() {
    if (scored) return;
    scored = true;
    var target = 78.8, s = null;
    var dur = COUNT;
    requestAnimationFrame(function step(t) {
      if (s === null) s = t;
      var p = Math.min((t - s) / dur, 1);
      num.textContent = ((1 - Math.pow(1 - p, 2)) * target).toFixed(1);   // ease-out
      if (p < 1) requestAnimationFrame(step);
      else document.querySelector('.recap-match').classList.add('done');  // "Outstanding Match"
    });
  }

  // Nothing counts until there is a picture to count over: the score waits for the clip's
  // first decoded frame ('playing'), so 0.0 is never left sitting on an empty screen. If
  // autoplay is refused that event never comes, so a 900ms clock starts it anyway.
  play(clip);
  function begin() {
    var m = document.querySelector('.recap-match');
    if (m.classList.contains('enter')) return;
    m.classList.add('enter');
    setTimeout(revealScore, 260);
  }
  if (clip.readyState >= 2 && !clip.paused) requestAnimationFrame(begin);
  else clip.addEventListener('playing', function () { requestAnimationFrame(begin); }, { once: true });
  setTimeout(begin, 900);

  // Autoplay can still be refused (Low Power Mode). Any first interaction starts it, and
  // so does coming back to the tab, so the screen is never left on a still frame.
  ['touchstart', 'pointerdown', 'click'].forEach(function (e) {
    document.addEventListener(e, function () { if (clip.paused) play(clip); }, { passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && clip.paused) play(clip);
  });
})();

// The full report dissolves out of the recap rather than sliding over it or cutting —
// see the report-in rules in main.css. It used to slide, and 프로토타입 2 skipped even
// that and got a hard cut; both ends of that screen are the same red wash, so a fade is
// what actually reads as continuous.
window.addEventListener('pageswap', function (e) {
  if (!e.viewTransition) return;
  var to = (e.activation && e.activation.entry && e.activation.entry.url) || '';
  if (to.indexOf('records.html') !== -1) e.viewTransition.types.add('report-in');
});
</script>
</body>
</html>

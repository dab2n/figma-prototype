<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FA3030">
<script defer src="assets/openext.js?v=846"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Session Recap</title>
<link rel="stylesheet" href="styles/main.css?v=846">
<link rel="stylesheet" href="styles/recap.css?v=846">
</head>
<body>
<div class="phone">
  <div class="screen recap-screen" id="recapScreen">
    <video class="recap-clip" id="clip" src="assets/video/recap-overlay.mp4"
           muted playsinline autoplay preload="auto" disablepictureinpicture></video>

    <div class="status-bar on-dark" style="position:absolute; top:0; left:0; z-index:6;"><img class="statusbar-svg" src="assets/icons/statusbar-full-dark.svg" alt="9:41"></div>

    <p class="recap-title">Session Recap</p>

    <div class="recap-match">
      <p class="recap-match-label">Outstanding Match</p>
      <div class="recap-pct"><span class="num">0.0</span><span class="unit">pts</span></div>
    </div>

    <a class="recap-full" href="records.html">
      <img src="assets/icons/explore-chevron-up.svg" alt="">
      <span>View Full Report</span>
    </a>
  </div>
</div>
<script>
// One clip, and it already carries the overlap of the creator's run and the user's.
// The screen plays it once — muted, playsinline, no controls, so it just runs on a
// phone too — and reveals the match score once the overlap has landed.
(function () {
  var clip = document.getElementById('clip');
  var num = document.querySelector('.recap-pct .num');
  var scored = false;

  function play(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }

  function revealScore() {
    if (scored) return;
    scored = true;
    var target = 78.8, dur = 900, s = null;
    requestAnimationFrame(function step(t) {
      if (s === null) s = t;
      var p = Math.min((t - s) / dur, 1);
      num.textContent = ((1 - Math.pow(1 - p, 2)) * target).toFixed(1);   // ease-out
      if (p < 1) requestAnimationFrame(step);
      else document.querySelector('.recap-match').classList.add('done');  // "Outstanding Match"
    });
  }

  // Number and clip start together.
  play(clip);
  revealScore();

  // Autoplay can still be refused. First touch starts it, so the screen is never left
  // sitting on a still frame.
  document.addEventListener('touchstart', function once() {
    document.removeEventListener('touchstart', once);
    if (clip.paused) play(clip);
  }, { passive: true });
})();

// Grab the "View Full Report" handle and drag up: the screen follows your finger, and
// past 60px it commits and the report slides in on the same gesture (detail-in). Let go
// short of that and it springs back. A wheel-down still counts as the same intent.
(function () {
  var sc = document.getElementById('recapScreen');
  var handle = document.querySelector('.recap-full');
  var startY = null, dy = 0, going = false;
  var MAX = 160, COMMIT = 60;

  function go() { if (going) return; going = true; location.href = 'records.html'; }
  function lift(px) { sc.style.transform = px ? 'translateY(' + px + 'px)' : ''; }

  handle.addEventListener('pointerdown', function (e) {
    startY = e.clientY; dy = 0;
    handle.style.animation = 'none';           // stop the hint bounce while dragging
    sc.style.transition = 'none';
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', function (e) {
    if (startY === null) return;
    dy = Math.max(-MAX, Math.min(0, e.clientY - startY));
    lift(dy);
  });
  function release() {
    if (startY === null) return;
    startY = null;
    sc.style.transition = 'transform .32s cubic-bezier(.32,.72,0,1)';
    if (dy <= -COMMIT) { lift(-MAX); go(); }
    else { lift(0); handle.style.animation = ''; }
  }
  handle.addEventListener('pointerup', release);
  handle.addEventListener('pointercancel', release);
  // Tapping it (no drag) still opens the report — it is a link.
  handle.addEventListener('click', function (e) { if (dy <= -8) e.preventDefault(); });

  var lock = false;
  sc.addEventListener('wheel', function (e) {
    if (lock || e.deltaY <= 10) return;        // scroll down gesture = pull content up
    lock = true; go();
  }, { passive: true });
})();

// Same cross-document transition as Explore Packs: the full report slides up on entry
// (detail-in) instead of a hard cut, so the swipe feels continuous.
window.addEventListener('pageswap', function (e) {
  if (!e.viewTransition) return;
  var to = (e.activation && e.activation.entry && e.activation.entry.url) || '';
  if (to.indexOf('records.html') !== -1) e.viewTransition.types.add('detail-in');
});
</script>
</body>
</html>

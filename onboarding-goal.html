<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<!-- The selected tick is a ::after, which is not fetched until something is selected.
     112KB arriving on the first tap is the blink; preloading it makes the tap instant. -->
<link rel="preload" as="image" href="assets/icons/check-circle.png">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1035"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Goal</title>
<link rel="stylesheet" href="styles/main.css?v=1035">
<link rel="stylesheet" href="styles/onboarding.css?v=1035">
<script defer src="assets/idle.js?v=1035"></script>
<script defer src="assets/flows.js?v=1035"></script>
</head>

    <div class="ob-appbar">
      <a class="back" href="onboarding-sport.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
      <a class="skip" href="onboarding-where.html">Skip</a>
    </div>

    <div class="ob-title">
      <h1>What do you<br>want to do most?</h1>
      <p>We’ll set the best default mode for you.</p>
    </div>

    <div class="ob-body" data-single>
      <div class="ob-list">
        <div class="ob-row" data-toggle><p class="t">Running</p><div class="img" style="background-image:url('assets/photos/sport-running.png?v=1035')"></div></div>
        <div class="ob-row" data-toggle><p class="t">Follow cool moves</p><div class="img" style="background-image:url('assets/photos/sport-dance.png?v=1035')"></div></div>
        <div class="ob-row" data-toggle><p class="t">Recovery, Care</p><div class="img" style="background-image:url('assets/photos/sport-hometraining.png?v=1035')"></div></div>
        <div class="ob-row" data-toggle><p class="t">Build Sport Skills</p><div class="img" style="background-image:url('assets/photos/sport-boxing.png?v=1035')"></div></div>
        <div class="ob-row" data-toggle><p class="t">Play with Friends</p><div class="img" style="background-image:url('assets/photos/sport-badminton.png?v=1035')"></div></div>
      </div>
    </div>
  </div>

  <nav class="tabbar ob-bottom">
    <div class="sb-row">
      <a class="ob-next" href="onboarding-where.html">Next <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script src="assets/onboarding.js?v=1035"></script>

</html>

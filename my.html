<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#ffffff">
<script defer src="assets/openext.js?v=1025"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — My</title>
<link rel="stylesheet" href="styles/main.css?v=1025">
<link rel="stylesheet" href="styles/my.css?v=1025">
</head>
<body>
<div class="phone">
  <div class="screen my-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="my-appbar">
      <span class="handle">@Jiwoo</span>
      <a class="menu" href="settings.html" aria-label="설정"><span></span><span></span><span></span></a>
    </div>

    <div class="my-profile">
      <img class="avatar" src="assets/photos/my-profile-hd.png?v=1025" alt="">
      <p class="name">Jiwoo Kim</p>
      <span class="tag"># Skilled User</span>
    </div>

    <div class="my-stats">
      <div class="stat-col"><div class="num">12</div><div class="lbl">Saved</div></div>
      <div class="stat-col"><div class="num">4</div><div class="lbl">Created</div></div>
      <div class="stat-col"><div class="num">24</div><div class="lbl">Friends</div></div>
    </div>

    <!-- Round segmented toggle (node 234:10261) — replaces the old Share/Edit
         buttons + underline tabs. Active segment gets the gray fill. -->
    <div class="my-tap" id="myTabs">
      <button class="seg active" data-panel="saved"><img src="assets/icons/bookmark-saved.svg" alt="">Saved</button>
      <button class="seg" data-panel="pack">My Pack</button>
    </div>

    <div class="my-panel active" data-panel="saved">
      <div class="saved-grid">
        <a class="cell c1" href="pyeongso.html" style="background-image:url('assets/photos/saved-c1.jpg?v=1025');"><span class="sv-badge sv-creator3">Creator</span></a>
        <a class="cell c2" href="pyeongso.html" style="background-image:url('assets/photos/saved-c2.png?v=1025');"><span class="sv-badge sv-prodark">Pro</span></a>
        <a class="cell c3" href="pyeongso.html" style="background-image:url('assets/photos/saved-c3.png?v=1025');"><span class="sv-badge sv-pro">Pro</span></a>
        <a class="cell c4" href="pyeongso.html" style="background-image:url('assets/photos/saved-c4.png?v=1025');"><span class="sv-badge sv-skilled">Skilled User</span></a>
        <a class="cell c5" href="pyeongso.html" style="background-image:url('assets/photos/saved-c5.png?v=1025');"><span class="sv-badge sv-creator">Creator</span></a>
        <a class="cell c6" href="pyeongso.html" style="background-image:url('assets/photos/saved-c6.png?v=1025');"><span class="sv-badge sv-creator2">Creator</span></a>
      </div>
    </div>

    <div class="my-panel" data-panel="pack">
      <div class="pack-grid">
        <a class="pack-card" href="pyeongso.html"><div class="thumb" style="background-image:url('assets/photos/pack-taekwondo.jpg?v=1025');"><span class="pk-hot"><img src="assets/icons/badge-fire.svg" alt="">HOT</span></div><p class="pk-title">Taekwondo Footwork</p><p class="pk-sub">18m</p></a>
        <a class="pack-card" href="pyeongso.html"><div class="thumb" style="background-image:url('assets/photos/pack-sprinter.jpg?v=1025');"></div><p class="pk-title">Sprinter's First Step</p><p class="pk-sub">4m</p></a>
        <a class="pack-card" href="pyeongso.html"><div class="thumb" style="background-image:url('assets/photos/pack-legburn.jpg?v=1025');"></div><p class="pk-title">Five-Minute Leg Burn</p><p class="pk-sub">5m</p></a>
        <a class="pack-card" href="pyeongso.html"><div class="thumb" style="background-image:url('assets/photos/pack-interval.jpg?v=1025');"></div><p class="pk-title">Easy Interval Run</p><p class="pk-sub">21m</p></a>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <div class="tabs">
      <a href="home.html"><img src="assets/icons/nav-home.svg" alt="홈"></a>
      <a href="packs.html"><img src="assets/icons/nav-packs.svg" alt="팩"></a>
      <a href="progress.html"><img src="assets/icons/nav-stats.svg" alt="통계"></a>
      <a href="my.html" class="active"><img src="assets/icons/nav-profile.svg" alt="프로필"><span class="dot"></span></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script>
// Saved | My Pack toggle
(function () {
  var tabs = document.getElementById('myTabs');
  var panels = document.querySelectorAll('.my-panel');
  tabs.addEventListener('click', function (e) {
    var t = e.target.closest('.seg');
    if (!t) return;
    tabs.querySelectorAll('.seg').forEach(function (x) { x.classList.toggle('active', x === t); });
    panels.forEach(function (p) { p.classList.toggle('active', p.dataset.panel === t.dataset.panel); });
  });
})();
</script>
</body>
</html>

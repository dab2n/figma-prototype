<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<!-- The selected tick is a ::after, which is not fetched until something is selected.
     112KB arriving on the first tap is the blink; preloading it makes the tap instant. -->
<link rel="preload" as="image" href="assets/icons/check-circle.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1037"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Setup · Level/Mode</title>
<link rel="stylesheet" href="styles/main.css?v=1037">
<link rel="stylesheet" href="styles/setup.css?v=1037">
<script defer src="assets/idle.js?v=1037"></script>
<script defer src="assets/flows.js?v=1037"></script>
</head>
<body>
<div class="phone">
  <div class="screen setup-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="setup-appbar">
      <a class="back" href="setup-injury.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
      <a class="skip" href="setup-main.html">Skip</a>
    </div>

    <div class="setup-title">
      <h1>How do you<br>want to move?</h1>
    </div>

    <div class="setup-body">
      <div class="setup-sec">
        <p class="setup-sec-label">Difficulty</p>
        <div class="diff-row" data-single>
          <button class="diff-seg" data-toggle>Guided</button>
          <button class="diff-seg" data-toggle>Standard</button>
          <button class="diff-seg" data-toggle>Near-Pro</button>
        </div>
      </div>

      <div class="setup-sec">
        <p class="setup-sec-label">Assist Mode</p>
        <div class="mode-scroll" data-group>
          <button class="mode-card" data-toggle>
            <div class="fig" style="background-image:url('assets/photos/mode-quiet.png?v=1037');"></div>
            <div class="fig fig-sel" style="background-image:url('assets/photos/mode-quiet-sel.png?v=1037');"></div>
            <span class="mc-badge">Recommended</span>
            <span class="mc-check"></span>
            <p class="mc-title">Quiet On</p>
            <p class="mc-desc">Reduced landing impact · minimal indoor noise</p>
          </button>
          <button class="mode-card" data-toggle>
            <div class="fig" style="background-image:url('assets/photos/mode-pace.png?v=1037');"></div>
            <div class="fig fig-sel" style="background-image:url('assets/photos/mode-pace-sel.png?v=1037');"></div>
            <span class="mc-check"></span>
            <p class="mc-title">Pace On</p>
            <p class="mc-desc">Auto-corrects knee and ankle wobble</p>
          </button>
          <button class="mode-card" data-toggle>
            <div class="fig" style="background-image:url('assets/photos/mode-load.png?v=1037');"></div>
            <div class="fig fig-sel" style="background-image:url('assets/photos/mode-load-sel.png?v=1037');"></div>
            <span class="mc-check"></span>
            <p class="mc-title">Load On</p>
            <p class="mc-desc">Build strength with added resistance</p>
          </button>
          <button class="mode-card" data-toggle>
            <div class="fig" style="background-image:url('assets/photos/mode-boost.png?v=1037');"></div>
            <div class="fig fig-sel" style="background-image:url('assets/photos/mode-boost-sel.png?v=1037');"></div>
            <span class="mc-check"></span>
            <p class="mc-title">Boost On</p>
            <p class="mc-desc">Automatic pace support in the final stretch</p>
          </button>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar setup-stepbar">
    <div class="sb-row">
      <div class="steps-wrap"><div class="steps">
      <a class="step" href="setup-location.html">Location</a>
      <a class="step" href="setup-condition.html">Condition</a>
      <a class="step" href="setup-injury.html">Injury check</a>
      <a class="step active" href="setup-level.html">Level/Mode</a>
      <a class="step" href="setup-main.html">Main Workout</a>
      </div></div>
      <a class="sb-next" data-next="setup-main.html">Next <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script src="assets/setup.js?v=1037"></script>
</body>
</html>

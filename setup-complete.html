<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Which of the two the page is: INSTALLED, where the app owns the screen and fills it,
     or a BROWSER, where it is the 360x780 frame on a white page. Decided here rather than
     in a media query so nothing depends on a browser reporting a width it was asked for.
     392/812 are the frame plus 16px of air; --fit scales it to whatever is actually there.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. -->
<script>(function(d){var r=d.documentElement,m=window.matchMedia,ios=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||navigator.standalone===true,i=navigator.standalone===true||/ NewtonShell/.test(navigator.userAgent);if(ios)r.className+=" ios";if(i)r.className+=" installed";window.__box=function(){var v=window.visualViewport;var w=innerWidth,h=innerHeight;if(v){w=Math.min(w,v.width);h=Math.min(h,v.height);}r.style.setProperty("--vpw",Math.round(w)+"px");r.style.setProperty("--vph",Math.round(h)+"px");if(!r.classList.contains("installed"))r.style.setProperty("--fit",Math.min(1.6,w/424,h/844).toFixed(4));};window.__box();try{var S=window.NewtonShell;if(S&&S.insetTop){var st=S.insetTop(),sb=S.insetBottom();if(st)r.style.setProperty("--sat",st+"px");if(sb)r.style.setProperty("--sab",sb+"px");}}catch(e){}if(!i)r.className+=" clay";})(document);</script>
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1089"></script>
<script defer src="assets/trail.js?v=1089"></script>
<script defer src="assets/i18n.js?v=1089"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Setup Complete</title>
<link rel="stylesheet" href="styles/freesentation.css?v=1089">
<link rel="stylesheet" href="styles/main.css?v=1089">
<link rel="stylesheet" href="styles/setup.css?v=1089">
<script defer src="assets/idle.js?v=1089"></script>
<script defer src="assets/flows.js?v=1089"></script>
</head>
<body>
<div class="phone">
  <div class="screen setup-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="setup-appbar">
      <a class="back" href="setup-main.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
    </div>

    <div class="setup-title">
      <h1>You’re ready<br>to move!</h1>
      <p>Your setup is complete.</p>
    </div>

    <div class="sc-body">
      <section class="sc-sec">
        <p class="sc-label">Pack</p>
        <div class="sc-pack">
          <div class="sc-thumb" style="background-image:url('assets/photos/packs-card2-thumb.jpg?v=1089'); background-position: center 30%;"></div>
          <div>
            <p class="sc-pack-title">Sean’s Pace Strategy</p>
            <p class="sc-pack-sub">Creator · 18m</p>
          </div>
        </div>
      </section>

      <section class="sc-sec">
        <p class="sc-label">Setup</p>
        <div class="sc-list">
          <a class="sc-row" href="setup-location.html"><span class="sc-row-title">Location &amp; Goal</span><span class="sc-row-right"><span class="sc-row-val">Outdoor · Standard</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-condition.html"><span class="sc-row-title">Condition</span><span class="sc-row-right"><span class="sc-row-val">About the same as usual</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-level.html"><span class="sc-row-title">Level &amp; Mode</span><span class="sc-row-right"><span class="sc-row-val">Pace On + Boost On</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-main.html"><span class="sc-row-title">Main Workout</span><span class="sc-row-right"><span class="sc-row-val">5km · 48m</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
        </div>
      </section>
    </div>
  </div>

  <nav class="tabbar setup-stepbar sc-bottom">
    <div class="sb-row">
      <a class="sc-later" id="scLater" href="schedule.html"><img src="assets/icons/clock-schedule.svg" alt=""><span>Later</span></a>
      <a class="sb-next ready" href="device-connection.html">Start Now <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
  <!-- Later asks before it leaves. The card is the app's own — the idle notice's shell,
       white, r20, 16/13 Supreme, over the same scrim — so this reads as the app speaking
       rather than as a dialog bolted on. -->
  <div class="idle-note sc-ask" id="scAsk" hidden>
    <div class="idle-card">
      <p class="idle-t">Set a time for this pack?</p>
      <p class="idle-s">We'll remind you when it comes round.</p>
      <div class="sc-ask-row">
        <button type="button" class="sc-ask-btn" data-ask="no">Not now</button>
        <button type="button" class="sc-ask-btn sc-ask-yes" data-ask="yes">Yes</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var later = document.getElementById('scLater'), ask = document.getElementById('scAsk');
  later.addEventListener('click', function (e) { e.preventDefault(); ask.hidden = false; });
  ask.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ask]');
    if (!b) { if (e.target === ask) ask.hidden = true; return; }
    if (b.getAttribute('data-ask') === 'yes') location.href = 'schedule.html';
    else location.href = 'home.html';
  });
})();
</script>
</body>
</html>

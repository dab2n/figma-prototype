<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1014"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Setup Complete</title>
<link rel="stylesheet" href="styles/main.css?v=1014">
<link rel="stylesheet" href="styles/setup.css?v=1014">
</head>
<body>
<div class="phone">
  <div class="screen setup-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="setup-appbar">
      <a class="back" href="setup-main.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
    </div>

    <div class="setup-title">
      <h1>You’re ready<br>to move!</h1>
      <p>Your setup is complete.</p>
    </div>

    <div class="sc-body">
      <section class="sc-sec">
        <p class="sc-label">Pack</p>
        <div class="sc-pack">
          <div class="sc-thumb" style="background-image:url('assets/photos/packs-card2-thumb.jpg?v=1014'); background-position: center 30%;"></div>
          <div>
            <p class="sc-pack-title">Sean’s Pace Strategy</p>
            <p class="sc-pack-sub">Creator Pack · 18m</p>
          </div>
        </div>
      </section>

      <section class="sc-sec">
        <p class="sc-label">Setup</p>
        <div class="sc-list">
          <a class="sc-row" href="setup-location.html"><span class="sc-row-title">Location &amp; Goal</span><span class="sc-row-right"><span class="sc-row-val">Outdoor · Standard</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-condition.html"><span class="sc-row-title">Condition</span><span class="sc-row-right"><span class="sc-row-val">About the same as usual</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-level.html"><span class="sc-row-title">Level &amp; Mode</span><span class="sc-row-right"><span class="sc-row-val">Pace On + Boost On</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
          <a class="sc-row" href="setup-main.html"><span class="sc-row-title">Main Workout</span><span class="sc-row-right"><span class="sc-row-val">5km · 48m</span><img class="sc-chev" src="assets/icons/chevron-right.svg" alt=""></span></a>
        </div>
      </section>
    </div>
  </div>

  <nav class="tabbar setup-stepbar sc-bottom">
    <div class="sb-row">
      <a class="sc-later" href="home.html"><img src="assets/icons/clock-schedule.svg" alt=""><span>Later</span></a>
      <a class="sb-next ready" href="device-connection.html">Start Now <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
</body>
</html>

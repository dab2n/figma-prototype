<!-- The page ships in English and swaps to Korean in assets/i18n.js. Chrome offering to
     translate it as well put a machine Korean on top of ours, in syllables the Korean face
     is not subset for, and re-ran itself on every mutation our own observer made. -->
<meta name="google" content="notranslate">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Which of the two the page is: INSTALLED, where the app owns the screen and fills it,
     or a BROWSER, where it is the 360x780 frame on a white page. Decided here rather than
     in a media query so nothing depends on a browser reporting a width it was asked for.
     392/812 are the frame plus 16px of air; --fit scales it to whatever is actually there.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. -->
<script>(function(d){var r=d.documentElement,m=window.matchMedia,ios=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||navigator.standalone===true,i=navigator.standalone===true||/ NewtonShell/.test(navigator.userAgent);if(ios)r.className+=" ios";if(i)r.className+=" installed";window.__box=function(){var v=window.visualViewport;var w=innerWidth,h=innerHeight;if(v){w=Math.min(w,v.width);h=Math.min(h,v.height);}r.style.setProperty("--vpw",Math.round(w)+"px");r.style.setProperty("--vph",Math.round(h)+"px");if(!r.classList.contains("installed"))r.style.setProperty("--fit",Math.min(1.6,w/424,h/844).toFixed(4));};window.__box();try{var S=window.NewtonShell;if(S&&S.insetTop){var st=S.insetTop(),sb=S.insetBottom();if(st)r.style.setProperty("--sat",st+"px");if(sb)r.style.setProperty("--sab",sb+"px");}}catch(e){}if(!i)r.className+=" clay";})(document);</script>
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>

<script>
// The figure is a clip, and a video element that has not started yet draws the platform's
// own play button over itself — here at 312px wide, which is most of the screen. It is
// hidden in CSS and revealed the moment it is genuinely running; until then what shows is
// the page's own grey, which is what the stage is anyway.
(function () {
  var v = document.querySelector('.injury-stage video');
  if (!v) return;
  v.muted = true;
  var p = v.play(); if (p && p.catch) p.catch(function () {});
  (function frame() {
    v.style.visibility = v.paused ? 'hidden' : 'visible';
    requestAnimationFrame(frame);
  })();
})();
</script>
<script>
// Tap the chip and it becomes a field; type an area and it becomes that chip, selected.
// It is a [data-toggle] from that moment on, so setup.js counts it, un-picks it and
// restores it exactly like the seven printed ones.
(function () {
  var chip = document.getElementById('ownChip');
  if (!chip) return;
  var LABEL = chip.textContent;

  function ask() {
    if (chip.querySelector('input')) return;
    var v = chip.getAttribute('data-own') || '';
    chip.textContent = '';
    chip.classList.add('editing');
    var f = document.createElement('input');
    f.type = 'text'; f.value = v; f.maxLength = 18;
    f.placeholder = 'Type an area';
    f.setAttribute('aria-label', 'Type an area');
    chip.appendChild(f);
    // The width follows what is typed, so the chip grows with the word rather than
    // sitting at some guessed size.
    function size() { f.style.width = Math.max(84, (f.value || f.placeholder).length * 8.6) + 'px'; }
    f.addEventListener('input', size); size();
    f.focus(); f.select();
    // A soft keyboard takes the bottom half of the screen and this row lives near it, so
    // the chip is brought into the middle of what is left. visualViewport is the only
    // thing that knows how much of the screen the keyboard actually took.
    function keepInView() { chip.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    keepInView();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', keepInView);
      f.addEventListener('blur', function () { window.visualViewport.removeEventListener('resize', keepInView); }, { once: true });
    }
    // Enter commits outright rather than going through blur — a soft keyboard's Done does
    // not always move focus, and on a page with nothing else focusable the blur may never
    // come. Tapping away still commits, through the blur below.
    f.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); done(); }
      if (e.key === 'Escape') { f.value = v; done(); }
    });
    f.addEventListener('change', done);
    f.addEventListener('blur', done);
  }

  function done() {
    var f = chip.querySelector('input');
    if (!f) return;
    var v = f.value.trim();
    chip.classList.remove('editing');
    chip.textContent = v || LABEL;
    if (v) {
      chip.setAttribute('data-own', v);
      chip.setAttribute('data-toggle', '');       // now it answers the question
      chip.classList.add('sel');
    } else {
      chip.removeAttribute('data-own');
      chip.removeAttribute('data-toggle');
      chip.classList.remove('sel');
    }
    // setup.js gates Next on every group having a .sel; ask it to look again.
    if (window.__setupRefresh) window.__setupRefresh();
  }

  chip.addEventListener('click', function (e) {
    // Once it holds an area it behaves like a chip — tap to un-pick, tap the pencil to
    // change it. A second tap on a SELECTED one re-opens the field.
    if (chip.classList.contains('editing')) return;
    if (chip.hasAttribute('data-own') && !chip.classList.contains('sel')) { chip.removeAttribute('data-own'); chip.textContent = LABEL; return; }
    if (chip.hasAttribute('data-own')) { e.stopPropagation(); ask(); return; }
    ask();
  });
})();
</script>

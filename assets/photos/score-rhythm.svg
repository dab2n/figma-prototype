<svg xmlns="http://www.w3.org/2000/svg" width="166" height="82" viewBox="21.23 17.42 166.8 82.4" fill="none">
<!-- Rhythm. Same build as Agility, run vertically: the wide exported blur stays as the
     ambient wash, a tighter blur carries the troughs, and the sharp copy fades out on
     the way down so the crests stay crisp and the feet melt. -->
<defs>
  <linearGradient id="rhStroke" x1="0" y1="33.5" x2="0" y2="76.434" gradientUnits="userSpaceOnUse">
    <stop offset="0.514423" stop-color="#FA3030"/>
    <stop offset="0.8125" stop-color="#FE6E3C"/>
    <stop offset="0.9999" stop-color="#FEC389"/>
    <stop offset="1" stop-color="#D1FEFF"/>
  </linearGradient>
  <filter id="rhWash" x="0" y="-2" width="304" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="rhBlur" x="0" y="-2" width="304" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="rhFade" x1="0" y1="34" x2="0" y2="70" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rhFadeInv" x1="0" y1="34" x2="0" y2="70" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <mask id="rhSharp" maskUnits="userSpaceOnUse" x="0" y="-2" width="304" height="112">
    <rect y="-2" width="304" height="112" fill="url(#rhFade)"/>
  </mask>
  <mask id="rhSoft" maskUnits="userSpaceOnUse" x="0" y="-2" width="304" height="112">
    <rect y="-2" width="304" height="112" fill="url(#rhFadeInv)"/>
  </mask>
  <g id="rhWaves">
    <path d="M32 74.5C35.2982 74.5 38.098 69.4485 40.2456 64.9043C43.1316 58.7979 47.6667 33.5 55.9123 33.5C63.3333 33.5 67.4561 55.3085 70.7544 64.9043C71.9537 68.3936 75.0421 74.5 79 74.5" stroke="url(#rhStroke)" stroke-width="3"/>
    <path d="M79 74.5C82.4386 74.5 85.3574 69.4485 87.5965 64.9043C90.6053 58.7979 95.3333 33.5 103.93 33.5C111.667 33.5 115.965 55.3085 119.404 64.9043C120.654 68.3936 123.874 74.5 128 74.5" stroke="url(#rhStroke)" stroke-width="3"/>
    <path d="M128 74.5C131.298 74.5 134.098 69.4485 136.246 64.9043C139.132 58.7979 143.667 33.5 151.912 33.5C159.333 33.5 163.456 55.3085 166.754 64.9043C167.954 68.3936 171.042 74.5 175 74.5" stroke="url(#rhStroke)" stroke-width="3"/>
    <path d="M175 74.5C178.368 74.5 181.228 69.4485 183.421 64.9043C186.368 58.7979 191 33.5 199.421 33.5C207 33.5 211.211 55.3085 214.579 64.9043C215.804 68.3936 218.958 74.5 223 74.5" stroke="url(#rhStroke)" stroke-width="3"/>
    <path d="M223 74.5C226.439 74.5 229.357 69.4485 231.596 64.9043C234.605 58.7979 239.333 33.5 247.93 33.5C255.667 33.5 259.965 55.3085 263.404 64.9043C264.654 68.3936 267.874 74.5 272 74.5" stroke="url(#rhStroke)" stroke-width="3"/>
  </g>
</defs>
<g mask="url(#rhSoft)"><use href="#rhWaves" filter="url(#rhWash)" opacity="0.9"/></g>
<g mask="url(#rhSoft)"><use href="#rhWaves" filter="url(#rhBlur)"/></g>
<g mask="url(#rhSharp)"><use href="#rhWaves"/></g>
</svg>

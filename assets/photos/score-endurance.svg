<svg xmlns="http://www.w3.org/2000/svg" width="166" height="48" viewBox="8 2 166 48" fill="none">
<!-- Endurance. Same build: the blur is masked to the trailing left end only, so the bar
     dissolves behind it while the leading edge stays a clean vertical cut.
     The grey remainder track is not here — it is a live layer in the card, because it
     animates on its own beat after the bar has run. -->
<defs>
  <linearGradient id="enFill" x1="115" y1="11.6653" x2="8" y2="11.6653" gradientUnits="userSpaceOnUse">
    <stop offset="0.514423" stop-color="#FA3030"/>
    <stop offset="0.55" stop-color="#FE6E3C"/>
    <stop offset="0.9999" stop-color="#FEC389"/>
    <stop offset="1" stop-color="#D1FEFF"/>
  </linearGradient>
  <filter id="enBlur" x="0" y="0" width="123" height="23" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <linearGradient id="enFade" x1="8" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <linearGradient id="enFadeInv" x1="8" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="enSharp" maskUnits="userSpaceOnUse" x="0" y="0" width="123" height="23">
    <rect width="123" height="23" fill="url(#enFade)"/>
  </mask>
  <mask id="enSoft" maskUnits="userSpaceOnUse" x="0" y="0" width="123" height="23">
    <rect width="123" height="23" fill="url(#enFadeInv)"/>
  </mask>
  <rect id="enBar" x="8" y="8" width="107" height="7" fill="url(#enFill)"/>
</defs>
<g mask="url(#enSoft)"><use href="#enBar" filter="url(#enBlur)"/></g>
<g mask="url(#enSharp)"><use href="#enBar"/></g>
</svg>

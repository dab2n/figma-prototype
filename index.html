<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The page ships in English and swaps to Korean in assets/i18n.js. Chrome offering to
     translate it as well put a machine Korean on top of ours, in syllables the Korean face
     is not subset for, and re-ran itself on every mutation our own observer made. -->
<meta name="google" content="notranslate">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Which of the two the page is: INSTALLED, where the app owns the screen and fills it,
     or a BROWSER, where it is the 360x780 frame on a white page. Decided here rather than
     in a media query so nothing depends on a browser reporting a width it was asked for.
     392/812 are the frame plus 16px of air; --fit scales it to whatever is actually there.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. -->
<script>(function(d){var r=d.documentElement,m=window.matchMedia,ios=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||navigator.standalone===true,i=navigator.standalone===true||/ NewtonShell/.test(navigator.userAgent);if(ios)r.className+=" ios";if(i)r.className+=" installed";window.__box=function(){var v=window.visualViewport;var w=innerWidth,h=innerHeight;if(v){w=Math.min(w,v.width);h=Math.min(h,v.height);}r.style.setProperty("--vpw",Math.round(w)+"px");r.style.setProperty("--vph",Math.round(h)+"px");if(!r.classList.contains("installed"))r.style.setProperty("--fit",Math.min(1.6,w/424,h/844).toFixed(4));};window.__box();try{var S=window.NewtonShell;if(S&&S.insetTop){var st=S.insetTop(),sb=S.insetBottom();if(st)r.style.setProperty("--sat",st+"px");if(sb)r.style.setProperty("--sab",sb+"px");}}catch(e){}if(!i)r.className+=" clay";})(document);</script>
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#FA3030">
<script defer src="assets/openext.js?v=1093"></script>
<script defer src="assets/trail.js?v=1093"></script>
<script defer src="assets/i18n.js?v=1093"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Welcome</title>
<link rel="stylesheet" href="styles/freesentation.css?v=1093">
<link rel="stylesheet" href="styles/main.css?v=1093">
<link rel="stylesheet" href="styles/onboarding.css?v=1093">
<script defer src="assets/flows.js?v=1093"></script>
<script defer src="assets/idle.js?v=1093"></script>
</head>
<body>
<div class="phone">
  <div class="screen ob-splash">
    <!-- The splash opens WHITE and washes to red over 1.9s, so for the first half second
         the light-glyph bar was white on white — no clock at all. The dark-glyph plate
         rides the SAME animation as the wash and leaves with it; multiply knocks its own
         white plate out, so what crosses over is only the glyphs. -->
    <div class="status-bar on-dark">
      <img class="statusbar-svg" src="assets/icons/statusbar-full-dark.svg" alt="9:41">
      <img class="statusbar-svg sb-early" src="assets/icons/statusbar-full.svg" alt="">
    </div>

    <p class="ob-turn">Now, Your Turn!</p>
    <div class="ob-logo"><img src="assets/icons/newton-logo.svg" alt="Newton"></div>

    <div class="ob-cta">
      <!-- Version 2 (see the switch at the foot of flows.html): this screen is the
           attract loop's resting place, so Get Started opens the list of flows rather
           than committing the next person to the first setup. -->
      <a class="ob-get" id="obGet" href="onboarding-sport.html">Get Started <img src="assets/icons/btn-arrow-sm-right.svg" alt=""></a>
      <a class="ob-account" href="home.html">Already have an account</a>
    </div>

    <div class="home-indicator"><span></span></div>
  </div>
</div>
<script>
// theme-color is what the OS paints its own status bar with, and this screen is not one
// colour: it is white for the first beat and Newton red by the end. Read the wash's own
// animated opacity rather than re-deriving its curve here, and mix the two ends with it.
(function () {
  var m = document.querySelector('meta[name="theme-color"]');
  var sp = document.querySelector('.ob-splash');
  if (!m || !sp || !window.getComputedStyle) return;
  var RED = [250, 48, 48], WHITE = [255, 255, 255], last = '';
  requestAnimationFrame(function f() {
    var o = parseFloat(getComputedStyle(sp, '::before').opacity);
    if (isNaN(o)) o = 0;
    var c = '#' + RED.map(function (v, i) {
      return ('0' + Math.round(v + (WHITE[i] - v) * o).toString(16)).slice(-2);
    }).join('').toUpperCase();
    if (c !== last) { m.setAttribute('content', c); last = c; }
    if (o > 0.002) requestAnimationFrame(f);
  });
})();
</script>
<script>
  try {
    if (localStorage.getItem("nw.ver") === "2") document.getElementById("obGet").setAttribute("href", "flows.html");
  } catch (e) {}
</script>
</body>
</html>

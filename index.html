<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#FA3030">
<script defer src="assets/openext.js?v=1016"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Welcome</title>
<link rel="stylesheet" href="styles/main.css?v=1016">
<link rel="stylesheet" href="styles/onboarding.css?v=1016">
</head>
<body>
<div class="phone">
  <div class="screen ob-splash">
    <div class="status-bar on-dark"><img class="statusbar-svg" src="assets/icons/statusbar-full-dark.svg" alt="9:41"></div>

    <p class="ob-turn">Now, Your Turn!</p>
    <div class="ob-logo"><img src="assets/icons/newton-logo.svg" alt="Newton"></div>

    <div class="ob-cta">
      <a class="ob-get" href="onboarding-sport.html">Get Started <img src="assets/icons/btn-arrow-sm-right.svg" alt=""></a>
      <a class="ob-account" href="home.html">Already have an account</a>
    </div>

    <div class="home-indicator"><span></span></div>
  </div>
</div>
</body>
</html>

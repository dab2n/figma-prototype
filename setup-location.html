<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1034"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Setup · Location</title>
<link rel="stylesheet" href="styles/main.css?v=1034">
<link rel="stylesheet" href="styles/setup.css?v=1034">
<script defer src="assets/idle.js?v=1034"></script>
<script defer src="assets/flows.js?v=1034"></script>
</head>
<body>
<div class="phone">
  <div class="screen setup-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="setup-appbar">
      <a class="back" href="pyeongso.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
      <a class="skip" href="setup-condition.html">Skip</a>
    </div>

    <div class="setup-title">
      <h1>Where are you<br>working out today?</h1>
    </div>

    <div class="setup-body">
      <div class="setup-sec">
        <p class="setup-sec-label">Location</p>
        <div class="toggle-row" data-single>
          <button class="toggle-btn" data-toggle><img src="assets/icons/setup-indoor.png" alt=""><span>Indoor</span></button>
          <button class="toggle-btn" data-toggle><img src="assets/icons/setup-outdoor.png" alt=""><span>Outdoor</span></button>
        </div>
      </div>

      <div class="setup-sec">
        <p class="setup-sec-label">Today’s Goal</p>
        <div class="card-list" data-single>
          <button class="card-sel" data-toggle><span class="cs-title">Beginner</span><span class="cs-desc">Following along for the first time</span></button>
          <button class="card-sel" data-toggle><span class="cs-title">Standard</span><span class="cs-desc">Getting used to the flow</span></button>
          <button class="card-sel" data-toggle><span class="cs-title">Near-Original</span><span class="cs-desc">Performing close to the real movement</span></button>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar setup-stepbar">
    <div class="sb-row">
      <div class="steps-wrap"><div class="steps">
      <a class="step active" href="setup-location.html">Location</a>
      <a class="step" href="setup-condition.html">Condition</a>
      <a class="step" href="setup-injury.html">Injury check</a>
      <a class="step" href="setup-level.html">Level/Mode</a>
      <a class="step" href="setup-main.html">Main Workout</a>
      </div></div>
      <a class="sb-next" data-next="setup-condition.html">Next <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script src="assets/setup.js?v=1034"></script>
</body>
</html>

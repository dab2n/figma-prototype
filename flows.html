<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The page ships in English and swaps to Korean in assets/i18n.js. Chrome offering to
     translate it as well put a machine Korean on top of ours, in syllables the Korean face
     is not subset for, and re-ran itself on every mutation our own observer made. -->
<meta name="google" content="notranslate">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Which of the two the page is: INSTALLED, where the app owns the screen and fills it,
     or a BROWSER, where it is the 360x780 frame on a white page. Measured AFTER the
     viewport tag, because innerWidth is only the width the page asked for once that
     tag has been read. -->
<script>(function(d){var r=d.documentElement,m=window.matchMedia,ios=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||navigator.standalone===true,i=navigator.standalone===true||/ NewtonShell/.test(navigator.userAgent);if(ios)r.className+=" ios";if(i)r.className+=" installed";window.__box=function(){var v=window.visualViewport;var w=innerWidth,h=innerHeight;if(v){w=Math.min(w,v.width);h=Math.min(h,v.height);}r.style.setProperty("--vpw",Math.round(w)+"px");r.style.setProperty("--vph",Math.round(h)+"px");if(!r.classList.contains("installed"))r.style.setProperty("--fit",Math.min(1.6,w/424,h/844).toFixed(4));};window.__box();try{var S=window.NewtonShell;if(S&&S.insetTop){var st=S.insetTop(),sb=S.insetBottom();if(st)r.style.setProperty("--sat",st+"px");if(sb)r.style.setProperty("--sab",sb+"px");}}catch(e){}if(!i)r.className+=" clay";})(document);</script>
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1092"></script>
<script defer src="assets/trail.js?v=1092"></script>
<script defer src="assets/i18n.js?v=1092"></script>
<script defer src="assets/flows.js?v=1092"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Try the flows</title>
<link rel="stylesheet" href="styles/freesentation.css?v=1092">
<link rel="stylesheet" href="styles/main.css?v=1092">
<link rel="stylesheet" href="styles/onboarding.css?v=1092">
<link rel="stylesheet" href="styles/flows.css?v=1092">
</head>
<body>
<div class="phone">
  <div class="screen ob-screen fl-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="fl-head">
      <h1>Explore Newton</h1>
      <p>See how Newton moves, from setup to report.</p>
    </div>

    <div class="fl-body">
      <div class="fl-sec">
        <p class="fl-label">Language</p>
        <!-- The one control on the app that is not translated: it is the thing you use when
             you cannot read the rest. -->
        <div class="fl-lang no-i18n" role="group" aria-label="Language">
          <button type="button" data-lang="ko">KOR</button>
          <button type="button" data-lang="en">ENG</button>
        </div>
      </div>

      <div class="fl-sec">
        <p class="fl-label">Flow</p>
        <div class="fl-grid">
          <a class="fl-card" href="index.html">
            <p class="fl-t">First Setup</p>
            <p class="fl-sub">Fit Newton and get ready to move.</p>
          </a>
          <a class="fl-card" href="home.html">
            <p class="fl-t">Explore Home</p>
            <p class="fl-sub">Find movements, packs, and recent activity.</p>
          </a>
          <a class="fl-card" href="setup-location.html">
            <p class="fl-t">Start a Workout</p>
            <p class="fl-sub">Set the session and start moving.</p>
          </a>
          <!-- Home is where this flow starts, but only with the strip: home.html's own
               inline script reveals it 1.8s after landing when notifNow is set. Set on the
               click rather than carried in the URL, so a reload of Home is Home again. -->
          <a class="fl-card" href="home.html" data-notif>
            <p class="fl-t">Check Your Report</p>
            <p class="fl-sub">See how the movement turned out.</p>
          </a>
        </div>
      </div>

      <!-- Two devices, one build. Which attract loop this machine runs, kept per
           BROWSER (localStorage) so each device holds its own answer and a walk
           through the app never changes it. Deliberately quiet: a hairline row of
           two dots at the foot of the hub, no label, no colour — the exhibitor
           knows what it is and nobody else has any reason to notice it. -->
      <div class="fl-ver no-i18n" id="flVer" role="group" aria-label="Attract mode">
        <button type="button" data-ver="1" aria-label="Version 1"></button>
        <button type="button" data-ver="2" aria-label="Version 2"></button>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelector('[data-notif]').addEventListener('click', function () {
    try { sessionStorage.setItem('notifNow', '1'); } catch (e) {}
  });
  // Version 1 — 20s of stillness goes back to Home.
  // Version 2 — it goes back to the splash (slogan + logo), and Get Started there opens
  // the flow list instead of the first setup. Read by assets/idle.js and by index.html.
  (function () {
    var box = document.getElementById("flVer");
    function cur() { try { return localStorage.getItem("nw.ver") === "2" ? "2" : "1"; } catch (e) { return "1"; } }
    function paint() {
      [].forEach.call(box.children, function (b) {
        b.classList.toggle("on", b.getAttribute("data-ver") === cur());
      });
    }
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-ver]");
      if (!b) return;
      try { localStorage.setItem("nw.ver", b.getAttribute("data-ver")); } catch (err) {}
      paint();
    });
    paint();
  })();

  // The toggle writes the choice and re-renders in place — every other screen reads the
  // same key on the way in, so the language is chosen once and holds for the whole walk.
  (function () {
    var box = document.querySelector('.fl-lang');
    function paint() {
      var cur = (window.__lang && window.__lang()) || 'en';
      [].forEach.call(box.children, function (b) {
        b.classList.toggle('on', b.getAttribute('data-lang') === cur);
      });
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-lang]');
      if (!b || !window.__setLang) return;
      window.__setLang(b.getAttribute('data-lang'));
      paint();
    });
    addEventListener('DOMContentLoaded', paint);
    paint();
  })();
</script>
</body>
</html>

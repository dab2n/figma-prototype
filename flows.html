<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<!-- Which of the two the page is: INSTALLED, where the app owns the screen and fills it,
     or a BROWSER, where it is the 360x780 frame on a white page. Measured AFTER the
     viewport tag, because innerWidth is only the width the page asked for once that
     tag has been read. -->
<script>(function(d){var r=d.documentElement,m=window.matchMedia,ios=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||navigator.standalone===true,i=(m&&(m("(display-mode: standalone)").matches||m("(display-mode: fullscreen)").matches))||navigator.standalone===true||/ NewtonShell/.test(navigator.userAgent);if(ios)r.className+=" ios";if(i)r.className+=" installed";window.__box=function(){var v=window.visualViewport;var w=innerWidth,h=innerHeight;if(v){w=Math.min(w,v.width);h=Math.min(h,v.height);}r.style.setProperty("--vpw",Math.round(w)+"px");r.style.setProperty("--vph",Math.round(h)+"px");if(!r.classList.contains("installed"))r.style.setProperty("--fit",Math.min(1,w/424,h/844).toFixed(4));};window.__box();try{var S=window.NewtonShell;if(S&&S.insetTop){var st=S.insetTop(),sb=S.insetBottom();if(st)r.style.setProperty("--sat",st+"px");if(sb)r.style.setProperty("--sab",sb+"px");}}catch(e){}try{if(localStorage.getItem("clay"))r.className+=" clay";}catch(e){}})(document);</script>
<!-- The four faces every screen actually renders in. Preloaded because font-display:swap
     draws the fallback first and re-lays the text out when the real one lands — on the
     phone that swap is what came out looking like broken type mid-transition. 64KB all in. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/offbit/OffBitTrial-DotBold.woff2" crossorigin>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2F2">
<script defer src="assets/openext.js?v=1062"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Try the flows</title>
<link rel="stylesheet" href="styles/main.css?v=1062">
<link rel="stylesheet" href="styles/onboarding.css?v=1062">
<link rel="stylesheet" href="styles/flows.css?v=1062">
</head>
<body>
<div class="phone">
  <div class="screen ob-screen fl-screen">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="fl-head">
      <h1>Try Newton</h1>
      <p>Four flows. Pick one and walk it end to end.</p>
    </div>

    <div class="fl-body">
      <!-- The step tag is the flow's place in the product, not a menu index: setup happens
           once, the other three are the loop you come back to. -->
      <div class="fl-grid">
        <a class="fl-card" href="index.html">
          <span class="fl-step">01</span>
          <p class="fl-t">First<br>Setup</p>
          <span class="fl-sub">Onboarding<br>Body scan</span>
        </a>
        <a class="fl-card" href="home.html">
          <span class="fl-step">02</span>
          <p class="fl-t">Explore<br>Home</p>
          <span class="fl-sub">Home · Packs<br>Pack detail</span>
        </a>
        <a class="fl-card" href="setup-location.html">
          <span class="fl-step">03</span>
          <p class="fl-t">Start a<br>Workout</p>
          <span class="fl-sub">Setup · Devices<br>Ready</span>
        </a>
        <!-- Home is where this flow starts, but only with the strip: home.html's own inline
             script reveals it 1.8s after landing when notifNow is set, which is the same
             door 프로토타입 2 walks through. Set on the click rather than carried in the URL
             so a reload of Home is an ordinary Home again. -->
        <a class="fl-card" href="home.html" data-notif>
          <span class="fl-step">04</span>
          <p class="fl-t">Session<br>Report</p>
          <span class="fl-sub">New on Home<br>Recap · Report</span>
        </a>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelector('[data-notif]').addEventListener('click', function () {
    try { sessionStorage.setItem('notifNow', '1'); } catch (e) {}
  });
</script>
</body>
</html>

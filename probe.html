<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Newton — viewport probe</title>
<style>
  /* Deliberately NOT the app's stylesheet: this page has to report what the phone says,
     not what the app's layout makes of it. Full bleed, so the four insets are the phone's
     own numbers. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #141A1A; }
  body { font: 400 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.4px; }
  p.sub { margin: 0 0 16px; color: #757575; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  td { padding: 5px 0; border-bottom: 1px solid #EFEFEF; vertical-align: top; }
  td:first-child { color: #757575; width: 46%; }
  td:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .v { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
  .ok   { background: #E8F6EC; color: #14532D; }
  .no   { background: #FDECEC; color: #7F1D1D; }
  .huh  { background: #F4F4F5; color: #3F3F46; }
  b { font-weight: 700; }
  #ua { word-break: break-all; font-size: 11px; color: #525252; }
</style>
</head>
<body>
<h1>Viewport probe</h1>
<p class="sub">Read this on the phone, screenshot it. The question is whether the app's WINDOW reaches behind the system bars — not whether a handle is drawn.</p>

<div id="verdicts"></div>
<table id="t"></table>
<p id="ua"></p>

<script>
(function () {
  // A probe element, so every CSS unit and every env() is measured the way the layout
  // engine actually resolves it rather than guessed at.
  var pad = document.createElement('div');
  pad.style.cssText = 'position:absolute;top:-9999px;left:0;width:1px;';
  document.body.appendChild(pad);
  function css(expr) { pad.style.height = expr; return Math.round(pad.offsetHeight); }
  function inset(side) { return css('env(safe-area-inset-' + side + ', 0px)'); }

  var v = window.visualViewport;
  var m = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1];
  var chrome = m ? parseInt(m, 10) : 0;
  var shell = / NewtonShell/.test(navigator.userAgent);
  var mode = ['fullscreen', 'standalone', 'minimal-ui', 'browser']
    .filter(function (x) { try { return matchMedia('(display-mode: ' + x + ')').matches; } catch (e) { return false; } })[0] || '?';
  if (shell) mode += ' (in the Android shell)';

  var vp = document.querySelector('meta[name=viewport]');
  var cover = /viewport-fit\s*=\s*cover/.test(vp ? vp.content : '');

  var dvh = css('100dvh'), lvh = css('100lvh'), svh = css('100svh'), vh = css('100vh');
  var top = inset('top'), bot = inset('bottom'), left = inset('left'), right = inset('right');
  var screenH = Math.round(screen.height);
  var clientH = document.documentElement.clientHeight;

  var rows = [
    ['display-mode', mode],
    ['viewport-fit=cover', cover ? 'yes' : 'NO'],
    ['Chrome / WebView', chrome || '?'],
    ['innerHeight', innerHeight],
    ['visualViewport.height', v ? Math.round(v.height) : '—'],
    ['100vh / 100dvh', vh + ' / ' + dvh],
    ['100lvh / 100svh', lvh + ' / ' + svh],
    ['html clientHeight', clientH],
    ['screen.height (css)', screenH],
    ['devicePixelRatio', devicePixelRatio],
    ['inset top / bottom', top + ' / ' + bot],
    ['inset left / right', left + ' / ' + right],
    ['dvh + bottom inset', dvh + bot],
  ];
  document.getElementById('t').innerHTML = rows.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');

  // ── the four questions, answered ──────────────────────────────────────────
  var out = [];
  function say(cls, text) { out.push('<div class="v ' + cls + '">' + text + '</div>'); }

  // The question is not whether a handle is DRAWN. It is whether the app's window reaches
  // behind the navigationBars inset. Two numbers settle it together and neither does alone:
  // how much of the screen the window covers, and what the bottom inset reports.
  var covered = innerHeight + top + bot;      // everything the page can address
  var missing = screenH - covered;            // screen the window never sees
  var drawsBehind = bot > 0;
  var reserved = !drawsBehind && missing > 4;

  say(drawsBehind ? 'ok' : 'no', '<b>A. is the window drawing behind the navigation inset?</b><br>' +
    (drawsBehind
      ? 'YES — the bottom inset reports ' + bot + 'pt, which is strip the page is addressing.'
      : reserved
        ? 'NO — the bottom inset is 0 AND the window is ' + missing + 'pt short of the screen. ' +
          'That strip is reserved OUTSIDE the app: not part of the page, so nothing in CSS reaches it.'
        : 'the inset is 0 and the window already covers the screen — there is no strip to draw behind.'));

  say(missing > 4 ? 'no' : 'ok', '<b>B. window against screen</b><br>' +
    'window ' + innerHeight + ' + insets ' + (top + bot) + ' = ' + covered +
    ' against a ' + screenH + 'pt screen' +
    (missing > 4 ? ' — <b>' + missing + 'pt outside the app.</b>' : ' — the whole screen.'));

  say('huh', '<b>C. what the strips measure</b><br>' +
    'top inset ' + top + 'pt, bottom inset ' + bot + 'pt. ' +
    (bot === 0 ? 'A 0 here does not mean the handle is off — it means the page is not addressing that strip.'
     : bot <= 30 ? 'That reads as a gesture handle.' : 'That reads as a three-button bar.'));

  say('huh', '<b>D. capability</b><br>viewport-fit=cover ' + (cover ? 'applied' : 'MISSING') +
    ', Chrome ' + (chrome || '?') + (chrome >= 108 ? ' (dvh/svh/lvh and env() all supported).' : '.'));

  document.getElementById('verdicts').innerHTML = out.join('');
  document.getElementById('ua').textContent = navigator.userAgent;

  // keep it live — the numbers move when the address bar slides
  var redraw = function () { location.reload(); };
  addEventListener('orientationchange', redraw);
})();
</script>
</body>
</html>

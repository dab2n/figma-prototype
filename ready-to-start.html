<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FA3030">
<script defer src="assets/openext.js?v=1005"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Ready to Start</title>
<link rel="stylesheet" href="styles/main.css?v=1005">
<link rel="stylesheet" href="styles/ready.css?v=1005">
</head>
<body>
<div class="phone">
  <div class="screen rts-screen">
    <!-- Red-blur gradient easing down from the top (below the text/foot). -->
    <div class="rts-blur"></div>
    <div class="status-bar on-dark"><img class="statusbar-svg" src="assets/icons/statusbar-full-dark.svg" alt="9:41"></div>

    <!-- Phase 1: pack name slides in (Newton red, color-burn), then clears. -->
    <p class="rts-pack">Sean’s Steady<br>Pace</p>

    <!-- Phase 2: floor tap ripple + tapping foot + prompt + start. -->
    <div class="rts-plate"></div>
    <div class="rts-plate2"></div>
    <div class="rts-foot"></div>
    <div class="rts-final">
      <div class="rts-prompt">
        <span class="s">To start</span>
        <span class="m">Tap your foot Twice</span>
        <span class="s">with the Wearable on</span>
      </div>
    </div>
    <a class="rts-start" href="home.html">Start workout</a>

    <div class="home-indicator"><span></span></div>
  </div>
</div>
</body>
</html>

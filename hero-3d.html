<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Hero Cards — 3D Space</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/supreme/Supreme-Bold.woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<!-- The card itself is home.css untouched: same radial fills, same plus-lighter shot, same
     blur slab, same button. Everything below is the SPACE the cards hang in. -->
<link rel="stylesheet" href="styles/home.css">
<style>
html, body { height: 100%; background: #000; margin: 0; overflow: hidden; cursor: default; }

/* Authored at 1920x1080 and only ever scaled, so a window recording is the same
   composition at any size. */
.stage {
  position: absolute; top: 50%; left: 50%;
  width: 1920px; height: 1080px;
  margin: -540px 0 0 -960px;
  transform: scale(var(--fit, 1));
  background: #000;
  /* The export frame, not a suggestion: this page is only ever looked at as 1920x1080, so
     the stage clips to it and the window letterboxes around it. Without the clip the outer
     ring of cards paints past the frame and a capture at 16:9 loses whatever it liked. */
  overflow: hidden;
}
/* ONE perspective for the whole field — that shared camera is what makes twenty separately
   angled cards read as one room rather than twenty skewed rectangles. 1400 is a wide-ish
   lens: at z -3000 a card projects to 32% of its size, which is the size difference the
   reference boards get between a foreground tile and a background one. */
.space { position: absolute; inset: 0; perspective: 1150px; perspective-origin: 50% 48%; }
.field {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  /* The space moves whether or not anyone touches it. Two axes on periods that do not divide
     into each other, so the camera never returns to the same attitude twice in a sitting.
     A CSS animation rather than the rAF loop below on purpose: a declarative timeline is
     what a headless capture can slow down and step through frame by frame. */
  animation: drift 47s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes drift {
  0%   { transform: rotateY(-3.4deg) rotateX(1.4deg) translate3d(-26px, 12px, 0); }
  38%  { transform: rotateY(1.8deg)  rotateX(-1.1deg) translate3d(18px, -16px, 40px); }
  71%  { transform: rotateY(-1.2deg) rotateX(1.9deg) translate3d(-12px, -6px, -30px); }
  100% { transform: rotateY(3.6deg)  rotateX(-1.6deg) translate3d(28px, 14px, 20px); }
}
/* Pointer parallax rides on top of the drift, on its own element so the two never fight
   over one transform property. */
.cam {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform: rotateY(var(--camx, 0deg)) rotateX(var(--camy, 0deg));
}
@media (prefers-reduced-motion: reduce) { .field { animation: none; } }

/* One seat per card. --x/--y are STAGE-pixel positions (the layout is authored in what you
   see, not in world units) — JS divides them by the card's own projection factor before
   writing them here, so a card at z -3000 needs 3x the world offset to land where it was
   drawn. --s is the card's own size on top of whatever perspective already did to it. */
.slot {
  position: absolute; top: 50%; left: 50%;
  width: 319px; height: 326px;
  margin: -163px 0 0 -159.5px;
  transform:
    translate3d(var(--x), var(--y), var(--z))
    rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)) rotateZ(var(--rz, 0deg))
    scale(var(--s, 1));
  transform-style: preserve-3d;
}
/* Distance haze. Perspective already shrinks a far card; this is the rest of what distance
   does — it dims, it desaturates, and it goes soft. All three come off one --t (0 near,
   1 far) that JS derives from z, so nothing can drift out of step with the geometry. */
.slot .hero-card {
  position: absolute; inset: 0; width: auto; height: auto; flex: none;
  filter:
    brightness(calc((1 - 0.86 * var(--t)) * var(--dim, 1)))
    saturate(calc(1 - 0.7 * var(--t)))
    blur(calc(var(--t) * var(--t) * 4px));
  opacity: calc(1 - 0.55 * var(--t));
}
/* Entrance and idle drift are separate elements on purpose: the entrance runs once and ends
   on identity, the drift runs forever, and neither has to know the other's numbers.
   One move for every card — up into its own seat, fading in. Cards used to fly in from
   their own side, which at thirty-four cards is thirty-four directions at once and reads as
   noise; the only thing that varies now is WHEN, and that is a left-to-right sweep. */
.fly {
  position: absolute; inset: 0; transform-style: preserve-3d;
  animation: fly .72s cubic-bezier(.17, .87, .21, 1) var(--delay, 0s) both;
}
@keyframes fly {
  from { opacity: 0; transform: translateY(72px); }
  to   { opacity: 1; transform: none; }
}
.bob {
  position: absolute; inset: 0; transform-style: preserve-3d;
  animation: bob var(--bd, 13s) ease-in-out var(--bdelay, 0s) infinite alternate;
}
@keyframes bob {
  0%   { transform: translate3d(0, -13px, 0) rotateY(-2deg) rotateX(1.2deg); }
  50%  { transform: translate3d(7px, 9px, 26px) rotateY(2deg) rotateX(-1deg); }
  100% { transform: translate3d(-6px, 15px, -20px) rotateY(3deg) rotateX(1.8deg); }
}
/* Reduced motion drops BOTH — the entrance's staggered delay is motion too, so killing only
   the duration would still hold twenty cards invisible for two seconds. `none` leaves .fly
   at its own identity transform, which is where the animation ended anyway. */
@media (prefers-reduced-motion: reduce) {
  .bob, .fly { animation: none; }
}
/* Far cards drop their type. At 30% projection the 28px title is 8px of mush; the reference
   boards are bare tiles at that distance for the same reason. */
.bare .hero-text, .bare .hero-btn, .bare .hero-blur { display: none; }
/* Filler cards are ordinary footage, not the black-backdrop shots the three heroes use, so
   they composite normally — plus-lighter would just add a whole daylit frame to the card
   and blow it white. The mask still fades them out at the bottom. */
.plain { mix-blend-mode: normal; }

/* Warm floor bounce under the near cards. A plain gradient, deliberately: this used to be a
   blurred ellipse laid down flat with rotateX(78deg), and a filtered element inside a
   preserve-3d parent is rasterised into a layer that clips its own blur — the clip drew a
   hard-edged rectangle of not-quite-black behind Akiyama every time he came in. A radial
   gradient is already soft, needs no filter and no 3D, and cannot have that edge. */
.pool {
  position: absolute; left: 50%; top: 100%;
  width: 680px; height: 300px; margin: -128px 0 0 -340px;
  background: radial-gradient(closest-side,
    rgba(252,104,58,0.26), rgba(250,60,40,0.11) 52%, rgba(250,48,48,0) 100%);
  pointer-events: none;
}
/* Vignette so the field falls off into black instead of ending at the window edge. */
.vig {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(125% 105% at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,0.55) 74%, rgba(0,0,0,0.92) 100%);
}
</style>
</head>
<body>
<div class="stage">
  <div class="space"><div class="field"><div class="cam" id="field"></div></div></div>
  <div class="vig"></div>
</div>

<script>
// Layout is authored in what you SEE: x/y are stage pixels from centre, z is depth. The
// world offset a card needs to land there is x/k where k is its own projection factor —
// done here rather than by hand, so moving a card in z does not move it across the screen.
var P = 1150;

// The three heroes: near, big, un-hazed, and each one turned a different way. Clip geometry
// is Figma's, per picture.
// The three heroes: near, big, un-hazed. Their angles are deliberately NOT a fan — two of
// them turn the same way and the tilts do not mirror, because a symmetric -21/0/+21 set
// reads as a carousel no matter how much space is around it.
// Five foreground cards. The two new ones are the portrait clips shot for this deck — the
// stock filler is landscape and crops to legs or an empty track in a near-square card, which
// is fine at 90px in the background and useless at 450. Each pair of same-athlete cards is
// put in opposite corners so neither reads as a duplicate of the other.
// Masks are opened up across the board (--mask-in/--mask-out): the artwork now stays solid
// most of the way down instead of fading out above the title, and every clip is scaled ~12%
// so the figure fills more of the card.
var HERO = [
  { x:-370, y:-388, z:  40, ry: -7, rx: 3,   rz:-5,  s:1.52, cls:'hero-card-live',
    clip:'hero3d-akiyama.mp4', vs:'top:-26px;width:300px;height:533px;--clip-bright:.74',
    mask:'--mask-in:44%;--mask-out:100%',
    title:"Akiyama's Ghost Step", tier:'Pro Pack', dur:'11 min', btn:'#FA3030' },
  { x:  95, y:  60, z:  20, ry:  9, rx:-3,   rz: 2,  s:1.40, cls:'hero-card-live hero-card-2',
    clip:'hero3d-sean.mp4', vs:'top:-14px;width:280px;height:498px;--clip-bright:.56',
    mask:'--mask-in:40%;--mask-out:92%',
    title:"Sean's Final 1km Pace", tier:'Creator Pack', dur:'18 min', btn:'#FB552F' },
  // Curry's maroon ramp sits close enough to Akiyama's red that at this size the two read as
  // the same card. --dim takes it down on top of the colourway rather than editing the Figma
  // gradient, so the card stays the card and only this composition dims it.
  { x: 630, y:-215, z:-300, ry:-11, rx: 3,   rz: 4,  s:1.28, t:0.16, cls:'hero-card-live hero-card-3',
    clip:'hero3d-curry.mp4', vs:'top:-18px;width:540px;height:540px;--clip-bright:.54', dim:0.82,
    mask:'--mask-in:44%;--mask-out:100%',
    title:"Curry's Step Back", tier:'Pro Pack', dur:'23 min', btn:'#8A1A00' },
  // These two are arena and gym footage rather than black-backdrop shots, so they composite
  // plainly and their masks hand the bottom third back to the gradient for the type.
  { x:-560, y: 240, z: -70, ry: 13, rx:-4,   rz: 3,  s:1.26, cls:'hero-card-live hero-card-3', plain:true,
    clip:'hero3d-ronaldo.png', vs:'top:-40px;width:360px;height:640px',
    mask:'--mask-in:28%;--mask-out:86%',
    title:"Ronaldo's Long Run", tier:'Pro Pack', dur:'34 min', btn:'#C4210A' },
  { x: 610, y: 240, z:-160, ry:-14, rx:-4,   rz:-3,  s:1.20, t:0.08, cls:'hero-card-live hero-card-2', plain:true,
    clip:'hero3d-euddeum.mp4', vs:'top:-30px;width:360px;height:480px',
    mask:'--mask-in:28%;--mask-out:86%',
    title:"Euddeum's Home Core", tier:'Creator Pack', dur:'21 min', btn:'#E0431C' }
];

// Filler: the repo's own stock sports clips, standing in until the real packs exist.
// Every clip that is big enough to recognise is used ONCE — a second Curry beside the Curry
// card reads as a duplicate, not as a field. Repeats are allowed only in the deep layer,
// where a card is 50-90px wide and there is nothing to recognise.
// The three bands are placed around the heroes rather than over them: the near six ring the
// frame edge, the mid six take the gaps the heroes leave, and the deep ten fill the middle
// distance so the black between the big cards is not empty.
var F = 'clip-';
var FILL = [
  // near band — the frame's outer edge, partly cropped by it
  { x:-930, y:-400, z:-1050, ry: 27, rx:-3, rz:-4, clip:F+'boxing.mp4' },
  { x: 955, y:-345, z:-1200, ry:-25, rx:-2, rz: 5, clip:F+'sprinter.mp4' },
  { x:-885, y: 405, z:-1300, ry: 12, rx: 4, rz: 4, clip:F+'ladder.mp4' },
  { x: 940, y: 400, z:-1000, ry:-28, rx: 3, rz:-5, clip:F+'tennis.mp4' },
  { x:  60, y:-500, z:-1350, ry:-13, rx: 7, rz: 2, clip:F+'basketball.mp4' },
  { x: 350, y: 500, z:-1150, ry: 22, rx:-7, rz:-3, clip:F+'strength.mp4' },
  // mid band — into the gaps between the three cards
  { x:-815, y: -75, z:-2000, ry: 19, rx: 2, rz: 3, clip:F+'bolt.mp4' },
  { x: 870, y:  95, z:-2300, ry:-17, rx:-2, rz:-2, clip:F+'interval.mp4' },
  { x:-720, y: 260, z:-2550, ry: 23, rx: 3, rz:-4, clip:F+'legburn.mp4' },
  { x: 330, y:-430, z:-2150, ry:-21, rx: 2, rz: 4, clip:F+'sprint.mp4' },
  // deep specks — picture only, dimmed nearly into the black. Not meant to be read; they are
  // what keeps the space between the big cards from being a hole.
  { x:-300, y: 120, z:-3400, ry: 17, rx: 3, rz: 3, clip:F+'tennis.mp4' },
  { x: 360, y: -90, z:-3900, ry:-13, rx:-3, rz:-2, clip:F+'sprinter.mp4' },
  { x:-100, y: 345, z:-4400, ry: 24, rx: 4, rz: 4, clip:F+'boxing.mp4' },
  { x: 150, y:-330, z:-4900, ry:-20, rx:-5, rz:-3, clip:F+'basketball.mp4' },
  { x:-540, y:-210, z:-5500, ry: 11, rx: 2, rz: 2, clip:F+'bolt.mp4' },
  { x: 580, y: 205, z:-6100, ry:-26, rx: 3, rz:-4, clip:F+'legburn.mp4' },
  { x: -30, y: -30, z:-6700, ry: 15, rx:-4, rz: 3, clip:F+'ladder.mp4' },
  { x:-430, y: 430, z:-7300, ry:-18, rx: 5, rz:-2, clip:'curry-step.mp4' },
  { x: 450, y:-430, z:-7900, ry: 21, rx:-2, rz: 4, clip:'akiyama-step.mp4' },
  { x:-730, y: 130, z:-8600, ry:-12, rx: 3, rz:-3, clip:'sean-running.mp4' }
];

// Filler cards borrow the three colourways in rotation so the field stays one palette.
var WAYS = ['hero-card-live', 'hero-card-live hero-card-2', 'hero-card-live hero-card-3'];
var Z_FAR = -9000;

var field = document.getElementById('field');   // the .cam layer — slots live here
var cards = HERO.slice()
  .concat(FILL.map(function (c, i) { c.cls = WAYS[i % 3]; c.fill = true; return c; }));

// Build order is irrelevant to what covers what — a preserve-3d field sorts by real depth,
// not by DOM order — so only the ENTRANCE is ordered here, and it is ordered by SCREEN X.
// One wave crossing the frame left to right, every card rising into its own seat as the wave
// reaches it. That is why the heroes are ranked in this list with everything else rather than
// treated as a group: Akiyama sits furthest left so he goes first, Sean next, Curry last,
// with the background cards at those x positions coming up alongside them.
var queue = [];
var rank = {};
cards.slice().sort(function (a, b) { return a.x - b.x; })
     .forEach(function (c, n) { rank[cards.indexOf(c)] = n; });

// The room is a bowl, not a wall. Two things do it, and they have to agree or the space
// reads as a flat plane with tilted cards on it:
//   1. everything away from centre is pushed BACK, by the square of its distance — the
//      frame edges recede the way the inside of a sphere does;
//   2. everything away from centre TURNS toward centre, so an edge card shows you its
//      inner face. A card at the left edge faces right, one at the bottom faces up.
// Both are derived from the card's authored position, so a card moved in the layout gets
// the curvature for its new seat automatically.
var BOWL = 3200;   // smaller = deeper dish
var TURN = 60;     // stage px per degree of yaw
var TIP  = 70;     // stage px per degree of pitch

cards.forEach(function (c, idx) {
  var i = rank[idx];                             // this card's place in the left-to-right wave
  var z = c.z - (c.x * c.x + c.y * c.y) / BOWL;  // seat on the dish
  var k = P / (P - z);                           // what perspective will do to this card
  // Non-linear: the haze has to bite early or the mid layer stays as loud as the heroes,
  // and it has to keep going all the way to -9000 for the specks to sit down in the black.
  var t = c.fill ? Math.pow(Math.min(1, z / Z_FAR), 0.55) : (c.t || 0);
  var slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.cssText =
    '--x:' + (c.x / k).toFixed(1) + 'px;--y:' + (c.y / k).toFixed(1) + 'px;--z:' + z.toFixed(0) + 'px;' +
    '--ry:' + (c.ry - c.x / TURN).toFixed(1) + 'deg;--rx:' + (c.rx + c.y / TIP).toFixed(1) + 'deg;' +
    '--rz:' + c.rz + 'deg;' +
    '--s:' + (c.s || 1) + ';--t:' + t.toFixed(3) + ';' + (c.dim ? '--dim:' + c.dim + ';' : '');

  var fly = document.createElement('div');
  fly.className = 'fly';
  fly.style.cssText = '--delay:' + (i * 0.033).toFixed(3) + 's;';

  var bob = document.createElement('div');
  bob.className = 'bob';
  bob.style.cssText = '--bd:' + (11 + (i % 5) * 1.7) + 's;--bdelay:-' + (i * 1.3) + 's;';

  var bare = !!c.fill;
  // A card is never allowed to be empty. Past 45% into the field it is 40-130px wide and
  // nobody can see it move, so it IS just a still — no bytes beyond one small jpeg and no
  // decoder. The rest carry the same still as their poster and only swap to moving footage
  // once the file has arrived: with a dozen clips fetched at once nothing had a frame to
  // paint and the whole field came up as bare gradients.
  // A card's artwork can be a still to begin with (no clip shot for it yet), in which case
  // there is nothing to preload and nothing to play — it is simply the image.
  var isClip = /\.mp4$/.test(c.clip);
  var poster = isClip ? 'assets/photos/poster/' + c.clip.replace('.mp4', '.jpg')
                      : 'assets/photos/' + c.clip;
  var still = !isClip || t > 0.45;
  var art = still
    ? '<img class="hero-clip" alt="" src="' + poster + '"'
    : '<video class="hero-clip" muted loop playsinline preload="none" disablepictureinpicture' +
      ' poster="' + poster + '" data-src="assets/photos/' + c.clip + '"';
  var a = document.createElement('a');
  a.className = 'hero-card ' + c.cls + (bare ? ' bare' : '');
  a.href = c.href || 'pyeongso.html';
  a.innerHTML =
    '<span class="hero-shot' + (c.fill || c.plain ? ' plain' : '') + '"' + (c.mask ? ' style="' + c.mask + '"' : '') + '>' +
      art + ' style="' + (c.vs || 'top:0;width:100%;height:100%') + ';object-fit:cover">' +
      (still ? '' : '</video>') +
    '</span>' +
    '<span class="hero-blur"><i></i><i></i></span>' +
    '<div class="hero-text"><p class="hero-title">' + (c.title || '') + '</p>' +
      '<div class="hero-meta"><span>' + (c.tier || '') + '</span>' +
      '<img class="sep" src="assets/icons/dot-sep-white.svg" alt="">' +
      '<span class="dim">' + (c.dur || '') + '</span></div></div>' +
    '<span class="hero-btn" style="--btn:' + (c.btn || '#FA3030') + '">View Now' +
      '<img src="assets/icons/btn-arrow-sm-right.svg" alt=""></span>';

  bob.appendChild(a);
  // Inside .fly, not beside it: parked on the slot the glow was painted from the first frame,
  // so a reload showed three warm pools sitting on an empty stage waiting for their cards.
  if (!c.fill) { var pool = document.createElement('span'); pool.className = 'pool'; fly.appendChild(pool); }
  fly.appendChild(bob);
  slot.appendChild(fly);
  field.appendChild(slot);

  var v = a.querySelector('video');
  if (v) queue.push({ v: v, rank: i });
});

// Fetched in the SAME left-to-right order the cards appear in, and started well before the
// wave reaches them, so a card is already moving the moment it rises rather than sitting on
// its poster for a beat. The 80ms spacing is the whole reason this works at all: a dozen
// clips requested in one go share the connection budget and a server that answers them
// serially, which is the "all posters, no video, ever" state this used to sit in.
// Playback is armed on loadeddata rather than fired once and hoped for — the first play()
// happens before there is a frame to show, and a clip that arrives late would never start.
// autoplay as an attribute is only honoured at parse time, and these were parsed by
// innerHTML and inserted afterwards, so play() is what actually starts them.
queue.sort(function (a, b) { return a.rank - b.rank; });
queue.forEach(function (q, n) {
  var go = function () { var p = q.v.play(); if (p) p.catch(function () {}); };
  q.v.addEventListener('loadeddata', go);
  setTimeout(function () {
    // preload has to come off before the src goes on: an element parked at preload="none"
    // takes the new src and then sits at readyState 0 forever, and play() alone does not
    // wake it. auto + an explicit load() is what actually starts the fetch.
    q.v.preload = 'auto';
    q.v.src = q.v.dataset.src;
    q.v.load();
    go();
  }, n * 80);
});

// Chrome pauses video-only muted playback in a background tab to save power and does NOT
// resume it on return — come back to the tab and the whole field is frozen on its posters.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  queue.forEach(function (q) {
    if (q.v.paused && q.v.src) { var p = q.v.play(); if (p) p.catch(function () {}); }
  });
});

// Pointer parallax on the whole field. Lerped rather than assigned, so the camera keeps
// gliding after the mouse stops instead of snapping to it.
var tx = 0, ty = 0, cx = 0, cy = 0;
addEventListener('pointermove', function (e) {
  tx = (e.clientX / innerWidth - 0.5) * -9;
  ty = (e.clientY / innerHeight - 0.5) * 5.5;
});
(function tick() {
  cx += (tx - cx) * 0.045; cy += (ty - cy) * 0.045;
  field.style.setProperty('--camx', cx.toFixed(3) + 'deg');
  field.style.setProperty('--camy', cy.toFixed(3) + 'deg');
  requestAnimationFrame(tick);
})();

var fit = function () {
  document.documentElement.style.setProperty('--fit',
    Math.min(innerWidth / 1920, innerHeight / 1080).toFixed(4));
};
addEventListener('resize', fit); fit();
</script>
</body>
</html>

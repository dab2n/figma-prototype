<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- The frame is a fixed 360x780; 812 is that plus 16px of air top and bottom.
     Inline and parser-blocking ON PURPOSE: --fit falls back to 1, so any frame painted
     before it is set shows the phone at FULL size and then snaps down. openext.js is
     deferred, which is after parsing but not reliably before the first paint — with three
     navigations in a row that flash was the viewport zooming in and out. -->
<script>if(innerWidth>400){document.documentElement.style.setProperty("--fit",Math.min(1,innerHeight/812).toFixed(4));try{if(localStorage.getItem("clay"))document.documentElement.className+=" clay";}catch(e){}}</script>
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=360, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#B6957A">
<script defer src="assets/openext.js?v=984"></script>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NEWTON">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Newton — Front Scan</title>
<link rel="stylesheet" href="styles/main.css?v=984">
<link rel="stylesheet" href="styles/onboarding.css?v=984">
<link rel="stylesheet" href="styles/scan.css?v=984">
</head>
<body>
<div class="phone">
  <!-- .wide is in the markup, not added by script: the camera is already full
       screen when this page arrives, so the cut from the intro is continuous. -->
  <div class="screen ob-screen scan-screen wide" data-stage="front">
    <div class="status-bar"><img class="statusbar-svg" src="assets/icons/statusbar-full.svg" alt="9:41"></div>

    <div class="scan-cam">
      <span class="scan-shot" style="background-image:url('assets/photos/scan-front.jpg?v=984')"></span>
      <span class="scan-dim"></span>
    </div>
    <div class="scan-wash"></div>
    <img class="scan-sil" src="assets/icons/scan-front-sil.svg?v=984" alt="">

    <div class="ob-appbar">
      <a class="back" href="scan-intro.html" aria-label="뒤로"><img src="assets/icons/appbar-back.svg" alt="뒤로"></a>
      <a class="skip" href="scan-ready.html">Skip</a>
    </div>

    <div class="ob-title scan-title">
      <div class="t-guide">
        <h1>Face the camera,<br>full body visible</h1>
        <p>Your whole body should be visible, head to toe</p>
      </div>
      <div class="t-scan">
        <h1>Scanning<br><span class="scan-pct">0%</span></h1>
      </div>
    </div>
  </div>

  <nav class="tabbar ob-bottom scan-bottom">
    <div class="sb-row">
      <div class="scan-steps">
        <span class="st on"><i>1</i>Front</span>
        <span class="st"><i>2</i>Side</span>
      </div>
      <a class="ob-next" href="scan-side.html">Next <img src="assets/icons/arrow-right-lg.svg" alt=""></a>
    </div>
    <div class="home-indicator"><span></span></div>
  </nav>
</div>
<script src="assets/scan.js?v=984"></script>
</body>
</html>
